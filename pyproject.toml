[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-framework"
version = "0.1.0"
description = "Custom LLM evaluation framework for RAG systems, chatbots, and AI agents"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "ragas>=0.1.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "rich>=13.0.0",
    "datasets>=2.14.0",
    "rank-bm25>=0.2.2",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-huggingface>=0.0.3",
    "langchain-groq>=0.1.3",
    "langchain-core>=0.2.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.2",
    "groq>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "ipython>=8.15.0",
]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
]

[project.scripts]
llm-eval = "eval_framework.cli.main:app"

[tool.setuptools]
packages = ["eval_framework"]
package-dir = {"" = "src"}

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow",
]
